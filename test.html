<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hibernate Knowledge Test</title>
    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: #192b3d;
            background: #f3f6fa;
        }

        body {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        main {
            background: #fff;
            border: 1px solid #dce4ed;
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            color: #174a78;
        }

        label {
            display: block;
            margin: 18px 0 6px;
            font-weight: 700;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #aebdcb;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button, .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            border: 0;
            border-radius: 7px;
            background: #1769aa;
            color: #fff;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover, button:focus, .back:hover, .back:focus {
            background: #104d80;
        }

        .back {
            margin-left: 8px;
            background: #52677b;
        }

        #errors {
            margin-bottom: 16px;
            padding: 12px 16px;
            border: 1px solid #d99;
            border-radius: 6px;
            background: #fff1f1;
            color: #861d1d;
        }

        #errors:empty {
            display: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Hibernate Knowledge Test</h1>
        <p>Enter your details and write a summary of what you learned.</p>
        <div id="errors" role="alert" aria-live="polite"></div>

        <form action="verification.jsp" method="post">
            <label for="name">Name (exactly 10 characters, starting with a capital letter)</label>
            <input id="name" name="name" type="text" required minlength="10" maxlength="10"
                   autocomplete="name">

            <label for="email">Email (must end in @gmail.com)</label>
            <input id="email" name="email" type="email" required
                   pattern="[A-Za-z0-9._%+-]+@gmail\.com" autocomplete="email">

            <label for="summary">Summary</label>
            <textarea id="summary" name="summary" required
                      placeholder="Summarize the Hibernate concepts from the reading."></textarea>

            <button type="submit">Submit</button>
            <a class="back" href="about.html">Back to reading</a>
        </form>
    </main>

    <script>
        const errors = new URLSearchParams(window.location.search).getAll("error");
        const errorBox = document.getElementById("errors");
        if (errors.length > 0) {
            const list = document.createElement("ul");
            errors.forEach((message) => {
                const item = document.createElement("li");
                item.textContent = message;
                list.appendChild(item);
            });
            errorBox.appendChild(list);
        }
    </script>
</body>
</html>
